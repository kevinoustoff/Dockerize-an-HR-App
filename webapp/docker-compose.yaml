version: '3.8'

services: 
  php: 
    image: php:8.2-apache
    container_name: php82
    ports: 
      - 8001:80
    volumes:
      - ./:/var/www/html
    build:
      context: .
      dockerfile: DockerFile

  db:
    image: mysql:8.0
    container_name: mysql8
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: pass 
      MYSQL_DATABASE: uha 
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    ports:
      - 3308:3306

  phpma:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    depends_on:
      - db
    environment: 
      PMA_HOST: db 
      PMA_USER: root
      PMA_PASSWORD: pass
      UPLOAD_LIMIT: 20M
      PMA_ARBITRARY: 1
    ports:
      - 8999:80
